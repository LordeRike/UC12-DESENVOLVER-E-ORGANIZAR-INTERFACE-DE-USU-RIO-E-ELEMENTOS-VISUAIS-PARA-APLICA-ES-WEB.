<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Curriculo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Saira+Extra+Condensed:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
    <div class="layout_container">
        <!--Barra Lateral (Sidebar)-->
        <!--<aside> indica barra lateral de apoio-->
        <aside class="sidebar">
            <div class="sidebar_inner">
                <!--Minha Foto com moldura-->
                <div class="avatar_container">
                    <img src="img/foto.png" alt="Foto de perfil de Henrique" class="avatar_img">
                </div>
                <!--Menu de Navagação-->
                <nav class="navigation_menu">
                    <!--Link Ativo-->
                    <a href="#sobre" class="nav_item active">
                        <span>Sobre</span>
                    </a>
                    <!--Outros Links-->
                    <a href="#experincias" class="nav_item">
                        <span>Experiências</span>
                    </a>
                    <a href="#educacao" class="nav_item">
                        <span>Educação</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!--Conteudo Principal-->
        <!--Main decarmca o conteudo mais importante da pagina-->
        <main class="main_content">
            <!--Seção de apresentação Pessoal-->
            <section id="sobre" class="intro_section">
                <!--Nome da pessoa em destaque-->
                <h1 class="hero_name">
                    Henrique <span class="accent_text">C Azeredo</span>
                </h1>

                <!--Lista de dados em tópicos-->
                <div class="contact_details">
                    <span>3542 Berry Street</span>
                    <span class="bullet_dot">●</span>
                    <span>Cheyenne Wells, CO 80810</span>
                    <span class="bullet_dot">●</span>

                    <!--Links "Clicaveis"-->
                    <a href="tel:3175858468" class="contact_link">(317) 585-8468</a>
                    <span class="bullet_dot">●</span>
                    <a href="mailto:henrike.costaa@gmail.com" class="contact_link contact_email">name@email.com</a>
                </div>
                <!--Bio Profissional-->
                <p class="bio_paragraph">
                    Sou estudante do Técnico em Desenvolvimento de Sistemas do Senac em Montenegro/RS.
                    Em busca de uma oportunidade na área de TI.
                </p>

                <!--Links de redes sociais-->
                <div class="social_links">
                    <a href="#" class="social_btn" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="https://www.instagram.com/coazt_rike" class="social_btn" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="#" class="social_btn" aria-label="Youtube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/henrique-azeredo" class="social_btn" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/LordeRike" class="social_btn" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </div>
            </section>
        </main>
    </div>
    
</body>
</html>
