<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Entre ou Cadastre-se</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

</head>
<body>
    <main class="page_wrapper">
        <div class="content_container">
            <!--Lado Esquerdo: Marca-->
            <section class="brand_section">
                <h1 class="logo">facebook</h1>
                <p class="tagline">
                    Conecte-se com amigos e com o mundo ao seu redor no Facebook.
                </p>
            </section>
            <!--Lado Direito - Formulário-->
            <section class="card_section">
                <!--Caixa branca (cartão do Login)-->
                <div class="login_card">
                    <form action="#" method="POST" class="login_form">
                        <div class="input_group">
                            <input type="email" id="email" placeholder=" " required autocomplete="username">
                            <label for="email" >E-mail ou número de telefone</label>
                        </div>

                        <div class="input_group">
                            <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                            <label for="password">Senha</label>
                        </div>

                        <button type="submit" class="btn btn_primary">Entrar</button>
                    </form>                   
                </div>                
            </section>

        </div>
    </main>
    
</body>
</html>
